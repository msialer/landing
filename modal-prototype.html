<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing — Booking Modal Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ivory: '#faf9f7',
            ink: '#171412',
            accent: '#FD7402',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    html { height: auto; }
    body {
      height: auto;
      min-height: 100vh;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* Prototype hero */
    .prototype-hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf9f7;
      padding: 2rem;
    }

    /* Tymeslot modal overrides — Option A: accent only on elements we control */
    #tymeslot-modal {
      background: rgba(23, 20, 18, 0.75) !important;
      backdrop-filter: blur(4px);
    }

    #tymeslot-modal [data-tymeslot-container] {
      background: #ffffff !important;
      border-radius: 12px !important;
      box-shadow: 0 25px 60px -12px rgba(23, 20, 18, 0.35) !important;
      max-width: min(560px, calc(100vw - 32px)) !important;
      max-height: 90vh !important;
    }

    /* Close button — accent color */
    #tymeslot-modal button[aria-label="Close booking widget"] {
      background: rgba(253, 116, 2, 0.9) !important;
      color: #ffffff !important;
      width: 36px !important;
      height: 36px !important;
      font-size: 24px !important;
      top: 12px !important;
      right: 12px !important;
      transition: transform 0.2s ease, background 0.2s ease !important;
    }
    #tymeslot-modal button[aria-label="Close booking widget"]:hover {
      background: #e56802 !important;
      transform: scale(1.05) !important;
    }

    /* Loader — accent color */
    .tymeslot-loader div {
      border-color: #f3f3f3 !important;
      border-top-color: #FD7402 !important;
    }
    .tymeslot-loader span {
      color: #737373 !important;
      font-family: 'Inter', system-ui, sans-serif !important;
    }

    /* Mobile: keep rounded corners and padding for a floating-modal feel */
    @media (max-width: 768px) {
      #tymeslot-modal {
        padding: 16px !important;
        align-items: flex-end !important;
      }
      #tymeslot-modal [data-tymeslot-container] {
        max-width: 100% !important;
        max-height: calc(100vh - 32px) !important;
        border-radius: 12px !important;
        width: 100% !important;
      }
    }
  </style>
</head>
<body class="bg-ivory text-ink antialiased leading-relaxed">

  <main class="prototype-hero">
    <div class="text-center max-w-xl">
      <h1 class="font-serif text-4xl sm:text-5xl font-semibold tracking-tight">Modal Prototype</h1>
      <p class="mt-4 text-ink/70 text-lg">Click the button below to test the Tymeslot booking modal.</p>

      <div class="mt-10">
        <button
          id="book-call-btn"
          type="button"
          class="inline-block bg-accent text-ink font-bold px-8 py-4 rounded-md tracking-wide hover:brightness-95 transition disabled:opacity-70 disabled:cursor-not-allowed"
        >
          Book a call
        </button>
      </div>

      <p class="mt-6 text-sm text-ink/50">
        If the booking widget fails to load, the button will fall back to opening<br />
        <a href="https://time.sialer.com/mauricio" target="_blank" rel="noopener" class="underline hover:text-accent">https://time.sialer.com/mauricio</a>.
      </p>
    </div>
  </main>

  <script>
    (function() {
      const USERNAME = 'mauricio';
      const FALLBACK_URL = 'https://time.sialer.com/' + USERNAME;
      const SCRIPT_URL = 'https://time.sialer.com/embed.js';
      const LOAD_TIMEOUT_MS = 8000;

      const btn = document.getElementById('book-call-btn');
      let scriptLoadState = 'idle'; // idle | loading | loaded | failed

      function loadScript() {
        if (scriptLoadState !== 'idle') return;
        scriptLoadState = 'loading';

        const existing = document.querySelector('script[src="' + SCRIPT_URL + '"]');
        if (existing) return;

        const script = document.createElement('script');
        script.src = SCRIPT_URL;
        script.async = true;

        script.onerror = function() {
          scriptLoadState = 'failed';
          console.error('Tymeslot embed script failed to load.');
        };

        document.head.appendChild(script);
      }

      function waitForTymeslot(timeoutMs) {
        return new Promise((resolve, reject) => {
          const start = Date.now();
          const interval = setInterval(() => {
            if (window.TymeslotBooking && typeof window.TymeslotBooking.open === 'function') {
              clearInterval(interval);
              scriptLoadState = 'loaded';
              resolve(window.TymeslotBooking);
            } else if (scriptLoadState === 'failed' || Date.now() - start > timeoutMs) {
              clearInterval(interval);
              reject(new Error('Tymeslot not available'));
            }
          }, 100);
        });
      }

      function openFallback() {
        window.open(FALLBACK_URL, '_blank', 'noopener,noreferrer');
      }

      async function handleBookingClick() {
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Opening...';

        try {
          loadScript();
          const Tymeslot = await waitForTymeslot(LOAD_TIMEOUT_MS);
          Tymeslot.open(USERNAME, {
            layout: 'column',
            maxWidth: 560,
          });
        } catch (err) {
          console.warn('Falling back to Tymeslot URL:', err);
          openFallback();
        } finally {
          btn.disabled = false;
          btn.textContent = originalText;
        }
      }

      btn.addEventListener('click', handleBookingClick);

      // Preload the script after window load for faster first-open.
      if (document.readyState === 'complete') {
        loadScript();
      } else {
        window.addEventListener('load', loadScript);
      }
    })();
  </script>
</body>
</html>
